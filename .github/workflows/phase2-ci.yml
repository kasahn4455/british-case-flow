name: Phase 2 verification

on:
  pull_request:
    paths:
      - "src/server/intake-v52/**"
      - "src/routes/api.intake.$publishedFormId.ts"
      - "tests/backend/**"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/phase2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backend tests
        run: npm run test:backend

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint Phase 2 files
        run: >-
          npx eslint
          src/server/intake-v52
          'src/routes/api.intake.$publishedFormId.ts'
          tests/backend

      - name: Production build
        run: npm run build
